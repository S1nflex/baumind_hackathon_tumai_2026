name: Weekly Market Price Scrape

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger market price ingestion
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET secrets are required" >&2
            exit 1
          fi
          curl --fail-with-body --retry 3 --retry-delay 10 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --request POST \
            "${APP_URL%/}/api/cron/scrape-prices"
