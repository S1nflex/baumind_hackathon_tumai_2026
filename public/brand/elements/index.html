ton><button class="tile" onclick="copyPath('/brand/elements/grass-tuft.webp')"><img loading="lazy" src="grass-tuft.webp" alt="grass-tuft.webp"><span>grass-tuft.webp</span></button><button class="tile" onclick="copyPath('/brand/elements/ivy-left.webp')"><img loading="lazy" src="ivy-left.webp" alt="ivy-left.webp"><span>ivy-left.webp</span></button><button class="tile" onclick="copyPath('/brand/elements/ivy-right.webp')"><img loading="lazy" src="ivy-right.webp" alt="ivy-right.webp"><span>ivy-right.webp</span></button><button class="tile" onclick="copyPath('/brand/elements/ivy-tendril.webp')"><img loading="lazy" src="ivy-tendril.webp" alt="ivy-tendril.webp"><span>ivy-tendril.webp</span></button><button class="tile" onclick="copyPath('/brand/elements/leaf-branch.webp')"><img loading="lazy" src="leaf-branch.webp" alt="leaf-branch.webp"><span>leaf-branch.webp</span></button><button class="tile" onclick="copyPath('/brand/elements/mountain-range.webp')"><img loading="lazy" src="mountain-range.webp" alt="mountain-range.webp"><span>mountain-range.webp</span></button><button class="tile" onclick="copyPath('/brand/elements/sun-halo.webp')"><img loading="lazy" src="sun-halo.webp" alt="sun-halo.webp"><span>sun-halo.webp</span></button><button class="tile" onclick="copyPath('/brand/elements/valley.webp')"><img loading="lazy" src="valley.webp" alt="valley.webp"><span>valley.webp</span></button></div><h2>Werkzeuge & Icons</h2><div class="grid"><button class="tile" onclick="copyPath('/brand/elements/icon-calculator.webp')"><img loading="lazy" src="icon-calculator.webp" alt="icon-calculator.webp"><span>icon-calculator.webp</span></button><button class="tile" onclick="copyPath('/brand/elements/icon-checklist.webp')"><img loading="lazy" src="icon-checklist.webp" alt="icon-checklist.webp"><span>icon-checklist.webp</span></button><button class="tile" onclick="copyPath('/brand/elements/icon-cost.webp')"><img loading="lazy" src="icon-cost.webp" alt="icon-cost.webp"><span>icon-cost.webp</span
